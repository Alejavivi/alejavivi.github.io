/* Layout concept: a Persona 3 Reload style menu. Slanted slabs stacked on the left, the selected one pushed out in white with a cyan echo; a notched content panel on the right; a slow tick-ring clock behind everything. One committed look: deep navy and electric blue, so dark values live on bare :root. */
:root {
  --bg: #020822;
  --bg-mid: #04114f;
  --blue: #1459ff;
  --blue-deep: #0a2fb8;
  --cyan: #22d6ff;
  --ice: #eaf7ff;
  --ink: #020a2c;
  --dim: #a9c0ff;
  --line: rgba(34, 214, 255, 0.42);
  --slab: rgba(20, 89, 255, 0.38);
  --card: rgba(20, 89, 255, 0.14);
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --label: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ice);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  min-height: 100%;
  overflow-x: clip;
}
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(110% 80% at 85% 0%, #0b3bd6 0%, transparent 55%),
    radial-gradient(90% 70% at 0% 100%, var(--blue-deep) 0%, transparent 60%),
    linear-gradient(160deg, var(--bg-mid), var(--bg) 70%);
}
.bg::before {
  content: ""; position: absolute; inset: -20%;
  background: repeating-linear-gradient(115deg, rgba(34, 214, 255, 0.07) 0 2px, transparent 2px 52px);
}
.ring {
  position: absolute; right: -16vmin; top: 50%;
  width: 92vmin; height: 92vmin; margin-top: -46vmin; border-radius: 50%;
  background: repeating-conic-gradient(var(--cyan) 0 0.5deg, transparent 0.5deg 6deg);
  -webkit-mask: radial-gradient(circle, transparent 61%, #000 61.5%, #000 66%, transparent 66.5%);
  mask: radial-gradient(circle, transparent 61%, #000 61.5%, #000 66%, transparent 66.5%);
  opacity: 0.28;
  animation: spin 180s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.wrap {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 36px;
}

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 22px; }
.who { min-width: 0; }
.eyebrow { font-family: var(--label); font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cyan); font-size: 0.95rem; }
.name { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: 0.9; margin: 4px 0 0; font-size: clamp(2.1rem, 5.4vw, 4rem); display: inline-block; transform: skewX(-10deg); transform-origin: left bottom; text-shadow: 4px 4px 0 var(--blue); text-wrap: balance; }
.right { display: flex; align-items: flex-end; gap: 22px; margin-left: auto; }
.lang { display: flex; gap: 6px; }
.lang button { font-family: var(--label); font-weight: 700; letter-spacing: 0.14em; font-size: 0.95rem; color: var(--ice); background: transparent; border: 1px solid var(--line); padding: 4px 12px; cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.lang button[aria-pressed="true"] { background: var(--cyan); color: var(--ink); border-color: var(--cyan); }
.date { text-align: right; line-height: 1; }
.date .md { font-family: var(--display); font-weight: 900; font-size: clamp(2.4rem, 6vw, 3.8rem); letter-spacing: 0.02em; display: inline-block; transform: skewX(-10deg); font-variant-numeric: tabular-nums; }
.date .dow { display: block; margin-top: 4px; font-family: var(--label); font-weight: 700; letter-spacing: 0.22em; font-size: 0.9rem; text-transform: uppercase; background: var(--cyan); color: var(--ink); padding: 2px 12px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); width: fit-content; margin-left: auto; }

/* stage */
.stage { display: grid; grid-template-columns: minmax(250px, 370px) minmax(0, 1fr); gap: clamp(20px, 3.5vw, 52px); align-items: start; }
.side { position: sticky; top: 20px; align-self: start; }
.menu { display: grid; gap: 14px; padding-right: 30px; }
.tab {
  position: relative; isolation: isolate; width: 100%;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 10px 30px 10px 26px;
  background: none; border: 0; color: var(--ice); cursor: pointer; text-align: left;
  font-family: var(--display); font-weight: 900; font-size: clamp(2rem, 3.4vw, 2.8rem); line-height: 1; letter-spacing: 0.03em; text-transform: uppercase;
  transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.25), color 0.15s;
}
.tab .t { display: inline-block; transform: skewX(-9deg); }
.tab small { font-family: var(--label); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.2em; opacity: 0.8; }
.tab::after, .tab::before { content: ""; position: absolute; inset: 0; clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
.tab::after { z-index: -1; background: var(--slab); transition: background 0.15s; }
.tab::before { z-index: -2; background: var(--cyan); transform: translate(8px, 8px); opacity: 0; transition: opacity 0.15s; }
.tab:hover::after { background: rgba(34, 214, 255, 0.34); }
.tab[aria-selected="true"] { color: var(--ink); transform: translateX(16px); }
.tab[aria-selected="true"]::after { background: var(--ice); }
.tab[aria-selected="true"]::before { opacity: 1; }
.tab:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
.hint { margin: 22px 0 0; font-family: var(--label); font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.85rem; color: var(--dim); }
.hint kbd { font-family: var(--label); border: 1px solid var(--line); padding: 0 6px; margin-right: 4px; color: var(--ice); }

/* panel */
.panel { position: relative; min-width: 0; background: linear-gradient(180deg, rgba(3, 16, 74, 0.9), rgba(2, 8, 34, 0.94)); border-left: 6px solid var(--cyan); clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 0 100%); padding: 0 clamp(18px, 3vw, 40px) 36px; }
.panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 24px 0 14px; border-bottom: 2px solid var(--line); margin-bottom: 26px; }
.panel-head h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(3rem, 8vw, 6rem); line-height: 0.85; margin: 0; transform: skewX(-10deg); transform-origin: left bottom; text-shadow: 5px 5px 0 var(--blue); min-width: 0; overflow-wrap: anywhere; }
.panel-head .tag { margin-right: 36px; }
.panel-body { animation: slide 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes slide { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.rise { animation: rise 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.lead { font-size: clamp(1.15rem, 2vw, 1.4rem); max-width: 40ch; margin: 0 0 26px; text-wrap: pretty; }
.facts { display: grid; margin: 0; }
.facts > div { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.facts dt { font-family: var(--label); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan); font-size: 0.95rem; padding-top: 3px; }
.facts dd { margin: 0; font-size: 1.1rem; }
.open { display: inline-block; font-family: var(--label); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; background: var(--cyan); color: var(--ink); padding: 0 12px; margin-right: 8px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }

.entry { position: relative; padding: 20px 22px 18px 26px; margin-bottom: 20px; background: var(--card); border: 1px solid var(--line); clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%); }
.entry::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--blue); }
.entry h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 3.2vw, 2.5rem); line-height: 1; text-transform: uppercase; margin: 0; letter-spacing: 0.01em; overflow-wrap: anywhere; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 10px; font-family: var(--label); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); font-size: 0.98rem; }
.entry p { margin: 0 0 10px; color: var(--dim); max-width: 62ch; }
.entry ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.entry li { position: relative; padding-left: 24px; max-width: 66ch; }
.entry li::before { content: ""; position: absolute; left: 3px; top: 0.62em; width: 11px; height: 6px; background: var(--cyan); transform: skewX(-30deg); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tag { font-family: var(--label); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.85rem; padding: 2px 14px; background: var(--cyan); color: var(--ink); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.tag.ghost { background: rgba(34, 214, 255, 0.16); color: var(--ice); }
.role { display: inline-block; margin: 0 0 8px; font-family: var(--label); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.9rem; color: var(--ink); background: var(--cyan); padding: 1px 16px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }

.jams { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.jams li { padding-left: 24px; }

/* project filters */

.chip { font-family: var(--label); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.95rem; padding: 5px 18px; background: transparent; color: var(--ice); border: 1px solid var(--line); cursor: pointer; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }

.pp { position: absolute; right: 14px; bottom: 14px; font-family: var(--label); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.85rem; padding: 3px 16px; background: var(--cyan); color: var(--ink); border: 0; cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }

.btn { font-family: var(--label); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.9rem; background: var(--ice); color: var(--ink); border: 0; padding: 6px 18px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.btn:hover { background: var(--cyan); }
.btn:focus-visible, .lang button:focus-visible, .contact a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .side { top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(2, 8, 34, 0.94); margin-inline: -8px; padding-inline: 8px; }

  .hint { display: none; }
  .right { width: 100%; justify-content: space-between; }

  .entry { padding: 16px 16px 16px 20px; }
  .cap { left: 10px; top: 10px; font-size: 0.78rem; letter-spacing: 0.1em; }
  .pp { right: 10px; bottom: 10px; }

}
@media (prefers-reduced-motion: reduce) {
  .ring, .panel-body, .rise { animation: none; }
  .tab { transition: none; }
}
</style>
